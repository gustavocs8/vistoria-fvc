<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vistoria FVC</title>
<meta name="theme-color" content="#262B29">
<meta name="description" content="Verificação de conformidade de equipamentos de fiscalização de velocidade">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vistoria FVC">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app de campo de uma coluna, barra "asfalto" fixa no topo com abas; cartões de ocorrência com faixa lateral de classificação. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E9ECE8; --ink:#1B2320; --muted:#5B6661; --line:#D5DBD6;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DFE8F5;
  --asphalt:#262B29; --asphalt-ink:#F1F3EF; --marking:#E8B320;
  --crit:#B3261E; --crit-soft:#F7DEDB; --warn:#9A6A00; --warn-soft:#FBEFCF; --ok:#2B7A4B; --ok-soft:#DCF0E3; --info:#2F5D8A; --info-soft:#DCE8F4;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A1F1D; --surface-2:#232A27; --ink:#E6ECE8; --muted:#9AA6A0; --line:#2E3733;
  --accent:#86AEE6; --accent-ink:#0A1426; --accent-soft:#18263A;
  --asphalt:#0B0E0D; --asphalt-ink:#E6ECE8; --marking:#E8B320;
  --crit:#F07167; --crit-soft:#3A1D1B; --warn:#F0BE4A; --warn-soft:#3A2E12; --ok:#5DC08A; --ok-soft:#173327; --info:#7FB2E5; --info-soft:#18283A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A1F1D; --surface-2:#232A27; --ink:#E6ECE8; --muted:#9AA6A0; --line:#2E3733;
  --accent:#86AEE6; --accent-ink:#0A1426; --accent-soft:#18263A;
  --asphalt:#0B0E0D; --asphalt-ink:#E6ECE8; --marking:#E8B320;
  --crit:#F07167; --crit-soft:#3A1D1B; --warn:#F0BE4A; --warn-soft:#3A2E12; --ok:#5DC08A; --ok-soft:#173327; --info:#7FB2E5; --info-soft:#18283A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--asphalt)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marking);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--asphalt);color:var(--asphalt-ink)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px 0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{font:500 12px/1.3 var(--f-body);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-chip{background:#fff;border-radius:6px;padding:3px 5px;display:flex;align-items:center;height:38px;flex:none}
.logo-chip img{max-height:32px;max-width:96px;display:block}
.croqui{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.croqui img{display:block;width:100%;max-width:100%}
.logo-prev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:center;min-height:72px}
.logo-prev img{max-height:64px;max-width:220px}
.sync{margin-left:auto;font:500 12px/1 var(--f-mono);display:flex;align-items:center;gap:6px;opacity:.85;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:#4CC38A}.dot.off{background:var(--marking)}
nav.tabs{display:flex;gap:4px;padding-block:8px 0}
nav.tabs a{flex:1;text-align:center;padding:10px 6px 12px;color:var(--asphalt-ink);opacity:.7;text-decoration:none;font:600 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--marking)}
.lane{height:4px;background:repeating-linear-gradient(90deg,var(--marking) 0 22px,transparent 22px 40px);opacity:.9}
main{padding-block:16px 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
/* form */
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 14px 16px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font:700 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:0 6px;color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:400}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:14px;cursor:pointer}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.req::after{content:" *";color:var(--crit)}
/* classification readout */
.readout{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--surface-2)}
.readout .gauge{flex:1;position:relative;height:28px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.readout .z{position:absolute;top:0;bottom:0}
.readout .z1{background:var(--crit-soft)}.readout .z2{background:var(--warn-soft)}
.readout .pin{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.readout .lbl{font:600 12px/1 var(--f-mono)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:600 12px/1.4 var(--f-body);white-space:nowrap}
.c-dentro{background:var(--crit-soft);color:var(--crit)}
.c-nedif{background:var(--warn-soft);color:var(--warn)}
.c-fora{background:var(--ok-soft);color:var(--ok)}
.c-nm{background:var(--surface-2);color:var(--muted)}
.s-pill{background:var(--info-soft);color:var(--info)}
.r-alto{color:var(--crit)}.r-medio{color:var(--warn)}.r-baixo{color:var(--ok)}
/* list */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:6px 1fr auto;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%}
.card:hover{border-color:var(--muted)}
.card .stripe{background:var(--muted)}
.card .stripe.c-dentro{background:var(--crit)}.card .stripe.c-nedif{background:var(--warn)}.card .stripe.c-fora{background:var(--ok)}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .km{font:600 18px/1.1 var(--f-mono)}
.card .meta{font-size:13px;color:var(--muted)}
.card .thumb{width:84px;height:100%;min-height:84px;object-fit:cover;background:var(--surface-2)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.empty svg{width:56px;height:56px;color:var(--muted)}
/* detail */
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{position:relative;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:36px;font-size:13px;background:var(--surface)}
.ph .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.ph figcaption{padding:6px 8px;font-size:13px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.timeline li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.timeline .d{font:500 12px/1.6 var(--f-mono);color:var(--muted)}
/* banner, toast, sheet */
.banner{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.info{background:var(--info-soft);border:1px solid var(--info)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--asphalt);color:var(--asphalt-ink);padding:12px 16px;border-radius:8px;z-index:50;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;gap:10px}
.savebar .btn{flex:1}
/* resumo */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font:700 30px/1 var(--f-display)}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:14px}
.barrow .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.barrow .t i{display:block;height:100%;background:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s}}

.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stp{flex:1 0 92px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:64px;color:var(--fg)}
.stp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.stp .tt{font-weight:700;font-size:13px}
.stp .ss{font-size:11px;color:var(--muted);line-height:1.2}
.stp.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stp.on .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stp.ok .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.fguia{display:flex;flex-direction:column;gap:10px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.fcard.ok{border-color:var(--ok);background:var(--ok-soft)}
.fcard.opc:not(.ok){border-style:dashed}
.fhead{display:flex;gap:10px;align-items:flex-start}
.fhead>div{flex:1}
.fdot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.fcard.ok .fdot{background:var(--ok);color:#fff;border-color:var(--ok)}
.fcount{font-weight:700;font-size:13px;color:var(--muted)}
.fprog{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px;border-radius:8px;background:var(--warn-soft);font-size:14px}
.fprog.ok{background:var(--ok-soft)}
.fprog span{font-weight:700;color:var(--ok)}
.ph select.phsel{border:0;border-top:1px solid var(--line);border-radius:0;min-height:34px;font-size:12px;width:100%;background:var(--surface)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;cursor:pointer}
.segb[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl a{color:var(--accent)}
.phsel{border:0;border-top:1px solid var(--line);border-radius:0;min-height:36px;font-size:13px;background:var(--surface);width:100%}
/* ===== Tema moderno ===== */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --ink:#141A24; --muted:#5E6878; --line:#E1E6EE;
  --accent:#2457C5; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --hdr1:#0F2A5C; --hdr2:#2457C5; --asphalt:#0F2A5C; --asphalt-ink:#F3F6FC; --marking:#FFC53D;
  --shadow:0 1px 2px rgba(16,28,52,.06),0 4px 16px rgba(16,28,52,.06);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1018; --surface:#151B26; --surface-2:#1C2431; --ink:#E7ECF4; --muted:#98A3B5; --line:#273142;
  --accent:#7DA6F5; --accent-ink:#0A1428; --accent-soft:#1B2A47; --hdr1:#0A1630; --hdr2:#1A3C80; --asphalt:#0A1630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1018; --surface:#151B26; --surface-2:#1C2431; --ink:#E7ECF4; --muted:#98A3B5; --line:#273142;
  --accent:#7DA6F5; --accent-ink:#0A1428; --accent-soft:#1B2A47; --hdr1:#0A1630; --hdr2:#1A3C80; --asphalt:#0A1630;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
body{font:400 15.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body::before{background:var(--hdr1)}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
header.bar{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(15,42,92,.25)}
.bar-in{padding-block:14px 4px}
.brand b{font:800 21px/1.1 var(--f-display);text-transform:none;letter-spacing:-.02em}
.brand small{opacity:.8}
.logo-chip{border-radius:10px;height:40px}
.sync{font:600 11.5px/1 var(--f-body);background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px}
nav.tabs{background:rgba(255,255,255,.12);border-radius:14px;padding:4px;gap:4px;margin-block:10px 14px}
nav.tabs a{font:600 14px/1 var(--f-body);text-transform:none;letter-spacing:0;padding:11px 6px;border:0;border-radius:10px;opacity:.85;transition:background .2s,color .2s}
nav.tabs a[aria-current="page"]{background:#fff;color:var(--hdr1);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
main{padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;text-transform:none}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.btn{border-radius:12px;font-weight:600;border-color:var(--line);box-shadow:0 1px 2px rgba(16,28,52,.05);transition:transform .08s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--hdr2));border-color:transparent;box-shadow:0 4px 14px rgba(36,87,197,.3)}
fieldset{border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 18px;gap:14px}
legend{float:left;width:100%;padding:0;margin-bottom:2px;font:700 13px/1.2 var(--f-body);letter-spacing:.06em;color:var(--accent)}
legend+*{clear:both}
label.f{font-weight:600;font-size:13.5px;color:var(--ink);gap:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);min-height:46px;padding:10px 12px;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.chips label{border:1.5px solid var(--line);background:var(--surface);font-weight:500;padding:9px 14px}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.readout{border-radius:12px}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.panel,.kpi{border:0!important;border-radius:var(--r)!important;box-shadow:var(--shadow)}
.kpi b{font:800 28px/1 var(--f-display);letter-spacing:-.03em}
.banner{border-radius:12px}
.sheet{border-radius:22px 22px 0 0}
.sheet-bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#toast{border-radius:12px;background:#141A24;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.savebar{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.savebar .btn{min-height:50px;font-size:15.5px}
.prog{height:6px;border:0;background:var(--line)}
.prog i{background:linear-gradient(90deg,var(--accent),var(--hdr2));border-radius:3px}
.stp{border:0;box-shadow:var(--shadow);border-radius:14px;min-height:66px}
.stp.on{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.stp .n{border:0}
.fcard{border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:14px}
.fcard.ok{box-shadow:0 0 0 1.5px var(--ok),var(--shadow)}
.fcard.opc:not(.ok){box-shadow:0 0 0 1.5px dashed var(--line)}
.fprog{border-radius:12px}
.ph{border:0;border-radius:12px;box-shadow:var(--shadow)}
.tbl th{font-size:11px}
/* seletor de equipamento */
.eqpick{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer;text-align:left}
.eqpick.set{border-style:solid;border-color:transparent;background:var(--surface-2)}
.eqpick .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 11px/1 var(--f-body)}
.eqpick .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.eqpick .tx b{font:700 16px/1.2 var(--f-mono)}
.eqpick .tx span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqpick .ch{flex:none;color:var(--muted);font-size:20px}
.eqsearch{position:sticky;top:-18px;background:var(--surface);padding-block:4px 10px;z-index:2;display:flex;flex-direction:column;gap:8px}
.eqchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.eqchips button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.eqchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.eqlist{display:flex;flex-direction:column;gap:8px}
.eqgrp{font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.eqitem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:var(--ink)}
.eqitem:active{transform:scale(.99)}
.eqitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.eqitem.off{opacity:.6}
.eqitem .km{flex:none;width:62px;text-align:center;font:700 14px/1.1 var(--f-mono);color:var(--accent)}
.eqitem .km small{display:block;font:500 10px/1.3 var(--f-body);color:var(--muted)}
.eqitem .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.eqitem .tx b{font:600 14.5px/1.2 var(--f-mono)}
.eqitem .tx span{font-size:12.5px;color:var(--muted)}
.eqitem .pill{font-size:11px}
</style>

function localDB(){
  const mem=new Map(),subs=new Set();
  const idb=new Promise(res=>{try{const r=indexedDB.open("vistoria-fd",1);r.onupgradeneeded=()=>r.result.createObjectStore("docs");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch{res(null)}});
  const ready=idb.then(db=>new Promise(res=>{if(!db)return res();const q=db.transaction("docs").objectStore("docs").openCursor();q.onsuccess=()=>{const c=q.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};q.onerror=()=>res()}));
  const persist=(path,val)=>idb.then(db=>{if(!db)return;return new Promise((ok,err)=>{const tx=db.transaction("docs","readwrite"),st=tx.objectStore("docs");val===undefined?st.delete(path):st.put(val,path);tx.oncomplete=ok;tx.onerror=()=>err({code:"quota_exceeded"});tx.onabort=()=>err({code:"quota_exceeded"})})});
  const pai=k=>k.split("/").slice(0,-1).join("/"),meta={fromCache:false,hasPendingWrites:false};
  const snap=k=>({id:k.split("/").pop(),exists:mem.has(k),data:()=>mem.get(k),metadata:meta});
  const avisa=()=>subs.forEach(f=>f());
  const lista=c=>[...mem.keys()].filter(k=>pai(k)===c).map(snap);
  const doc=k=>({id:k.split("/").pop(),path:k,
    get:async()=>{await ready;return snap(k)},
    set:async d=>{await ready;const v=JSON.parse(JSON.stringify(d));await persist(k,v);mem.set(k,v);avisa()},
    update:async d=>{await ready;if(!mem.has(k))throw{code:"invalid_argument"};const v={...mem.get(k),...JSON.parse(JSON.stringify(d))};await persist(k,v);mem.set(k,v);avisa()},
    delete:async()=>{await ready;await persist(k,undefined);mem.delete(k);avisa()},
    onSnapshot(next){const f=()=>next(snap(k));subs.add(f);ready.then(f);return()=>subs.delete(f)}});
  const collection=c=>({path:c,doc:id=>doc(c+"/"+(id||newId())),
    get:async()=>{await ready;const d=lista(c);return{docs:d,size:d.length,empty:!d.length,metadata:meta}},
    onSnapshot(next){const f=()=>{const d=lista(c);next({docs:d,size:d.length,empty:!d.length,metadata:meta,docChanges:()=>[]})};subs.add(f);ready.then(f);return()=>subs.delete(f)}});
  return{doc,collection};
}

  dataVerificacao:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,horaVerificacao:`${p(d.getHours())}:${p(d.getMinutes())}`,
  rodovia:"",uf:"TO",municipio:"",velLeves:"",velPesados:"",tipoRodovia:"",classificacao:"",faixasCresc:"",faixasDecresc:"",largCresc:"",largDecresc:"",
  acostCLE:"",acostCLD:"",acostDLE:"",acostDLD:"",barAntesL:"",barAntesP:"",barPontoL:"",barPontoP:"",barDepoisL:"",barDepoisP:"",displays:"",luminoso:"",obs2:"",
  placas:{C:{LE:[],LD:[]},D:{LE:[],LD:[]}},obs3:"",
  shPintOc:"",shPintCond:"",shTachOc:"",shTachCond:"",obsSH:"",
  m41:"",m42:"",m43:"",m44:"",m45:"",obs4:"",defOc:"",defCond:"",obs5:"",
  parecer:"",respNome:resp.nome||"",respFuncao:resp.funcao||""}}
const getP=(o,path)=>path.split(".").reduce((a,k)=>a==null?a:a[k],o);
function setP(o,path,v){const ks=path.split(".");let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks.at(-1)]=v}
const placaNome=s=>s.tipo==="Educativa"?"Educativa":s.tipo?`${s.tipo}${s.vel?` (${s.vel} km/h)`:""}`:"Placa";
function todasPlacas(F){const out=[];for(const sk of ["C","D"])for(const lk of ["LE","LD"])((F.placas&&F.placas[sk]&&F.placas[sk][lk])||[]).forEach((s,i)=>out.push({...s,sk,lk,i}));return out}

/* ===== Não conformidades e parecer sugerido ===== */
function ncs(F){const L=[],add=(item,txt,rec)=>L.push({item,txt,rec});const eq=F.tipoEquip;
  if(F.vandalizado==="Sim")add("2.1.1","Equipamento com sinais de vandalismo.","A contratada deverá recompor os componentes danificados e restabelecer a operação do equipamento, com registro fotográfico após a intervenção.");
  if(F.displays==="Desligados")add("2.2","Displays desligados no momento da verificação.",eq==="REV"?"A contratada deverá restabelecer o funcionamento dos displays, obrigatórios em redutor eletrônico de velocidade (Resolução CONTRAN nº 798/2020, art. 3º, I, b).":"A contratada deverá verificar e restabelecer o funcionamento dos displays.");
  if(F.displays==="Ligados, com defeito")add("2.2","Displays ligados, com defeito.","A contratada deverá corrigir o defeito dos displays, garantindo a exibição correta da velocidade registrada.");
  if(F.luminoso==="Desligados")add("2.2","Dispositivo luminoso desligado no momento da verificação.","A contratada deverá restabelecer o funcionamento do dispositivo luminoso.");
  if(F.luminoso==="Ligados, com defeito")add("2.2","Dispositivo luminoso ligado, com defeito.","A contratada deverá corrigir o defeito do dispositivo luminoso.");
  for(const p of todasPlacas(F)){if(!p.tipo&&!p.pres)continue;const onde=`sentido ${SENTIDOS[p.sk].toLowerCase()}, ${LADOS[p.lk].toLowerCase()}${num(p.d)!=null?`, a ${fmtN(num(p.d))} m do equipamento`:""}`;
    if(p.pres==="Ausente")add("3",`Placa ${placaNome(p)} ausente (${onde}).`,`A contratada deverá providenciar a implantação da placa ${placaNome(p)} na posição prevista (${onde}).`);
    else if(p.cond==="Ruim"){const c=COD_RUIM[p.cod]||"condição ruim";const acao={"1":"a limpeza ou a substituição","2":"a roçada ou poda da vegetação para desobstrução","3":"a limpeza","4":"a substituição","5":"a adequação da sinalização para eliminar o conflito"}[p.cod]||"a recuperação";
      add("3",`Placa ${placaNome(p)} em condição ruim: ${c.toLowerCase()} (${onde}).`,`A contratada deverá providenciar ${acao} da placa ${placaNome(p)} (${onde}).`)}}
  if(eq==="REV"||eq==="CEM"){
    if(F.shPintOc==="Insuficiente"||F.shPintCond==="Ruim")add("SH",`Pintura no pavimento junto ao equipamento ${[F.shPintOc==="Insuficiente"?"insuficiente":"",F.shPintCond==="Ruim"?"em condição ruim":""].filter(Boolean).join(" e ")}.`,"A contratada deverá recompor a sinalização horizontal junto ao equipamento.");
    if(eq==="REV"&&(F.shTachOc==="Insuficiente"||F.shTachCond==="Ruim"))add("SH",`Tachas e tachões junto ao equipamento ${[F.shTachOc==="Insuficiente"?"insuficientes":"",F.shTachCond==="Ruim"?"em condição ruim":""].filter(Boolean).join(" e ")}.`,"A contratada deverá recompor as tachas e os tachões junto ao equipamento.")}
  if(F.m41==="Ruim")add("4.1","Pavimento em condição ruim no ponto fiscalizado.","Recomenda-se comunicar a Unidade Local do DNIT para a recuperação do pavimento no ponto fiscalizado.");
  if(F.m42==="Sim")add("4.2","Vegetação encobrindo o equipamento, as câmeras ou os displays.","A contratada deverá executar a poda ou roçada da vegetação, desobstruindo o equipamento, as câmeras e os displays.");
  if(F.m43&&F.m43!=="Não")add("4.3",`Lombada física a até 200 m do equipamento (${F.m43.toLowerCase()}).`,"Recomenda-se avaliar, com a Unidade Local do DNIT, a compatibilidade da lombada física com a operação do equipamento.");
  if(F.m44==="Sim")add("4.4","Buracos e/ou deformações no pavimento.","Recomenda-se comunicar a Unidade Local do DNIT para a correção dos buracos e deformações.");
  if(F.defOc==="Sim"&&F.defCond==="Ruim")add("5.1","Defensa metálica em condição ruim.","Recomenda-se comunicar a Unidade Local do DNIT para a recuperação da defensa metálica.");
  return L}
function parecerSugerido(F){const n=ncs(F),eq=TIPO_EQ_NOME[F.tipoEquip]||F.tipoEquip,pl=todasPlacas(F).filter(p=>p.tipo||p.pres);
  const id=`o equipamento ${F.codEquip||"(código não informado)"}, do tipo ${eq}${F.tipoEquip?` (${F.tipoEquip})`:""}, instalado na ${F.rodovia||"rodovia"}/${F.uf||""}, km ${fmtKm(num(F.kmCampo))}${F.municipio?`, no município de ${F.municipio}`:""}${F.contratada?`, sob responsabilidade da contratada ${F.contratada}${F.contrato?` (contrato nº ${F.contrato}${F.lote?`, lote ${F.lote}`:""})`:""}`:""}`;
  const p=[`Em verificação realizada em ${fmtD(F.dataVerificacao)}, ${id}, ${n.length?`apresentou ${n.length} não conformidade${n.length>1?"s":""} nos itens verificados nesta ficha.`:"não apresentou não conformidades nos itens verificados nesta ficha."}`];
  const sing=t=>t.toLowerCase().replace("ligados","ligado").replace("desligados","desligado");
  if(F.displays)p.push(`Os displays encontravam-se ${F.displays.toLowerCase()}${F.luminoso?` e o dispositivo luminoso, ${sing(F.luminoso)}`:""}.`);
  if(pl.length){const aus=pl.filter(x=>x.pres==="Ausente").length,ruim=pl.filter(x=>x.pres==="Presente"&&x.cond==="Ruim").length;
    p.push(aus||ruim?`Das ${pl.length} placas de sinalização vertical verificadas, ${aus?`${aus} ${aus>1?"estão ausentes":"está ausente"}`:""}${aus&&ruim?" e ":""}${ruim?`${ruim} ${ruim>1?"apresentam":"apresenta"} condição ruim`:""}.`:`As ${pl.length} placas de sinalização vertical verificadas estão presentes e em boa condição.`)}
  if(n.length){p.push("Diante do exposto, recomenda-se:");n.forEach((x,i)=>p.push(`${i+1}. ${x.rec}`))}
  if(F.m45==="Sim")p.push("Registra-se a existência de obras no pavimento em andamento no ponto fiscalizado.");
  p.push("A presente manifestação possui caráter técnico e restringe-se aos itens verificados nesta ficha.");
  return p.join("\n")}

/* ===== Capacidades ===== */
async function boot(){
  route();window.addEventListener("hashchange",route);
  const c=window.claude;
  if(!c||!c.use){S.canEdit=true;S.local=true;S.db=localDB();S.downloads=localDownloads;setSync(true,"neste aparelho");subscribe();render();return}
  const [db,user,assets,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("assets"),c.use("downloads")]);
  Object.assign(S,{db,user,assets,downloads});
  if(user){S.me=await user.me();S.canEdit=S.me.canEdit}
  if(!db){setSync(false,"sem base");S.err="A base compartilhada não está disponível nesta visualização. Entre na sua conta para registrar e consultar fichas.";render();return}
  subscribe();render();
}
function setSync(on,t){$("#syncDot").className="dot "+(on?"on":"off");$("#syncTxt").textContent=t}
function subscribe(){
  const timer=setTimeout(()=>{if(!S.loaded){S.stale=true;setSync(false,"sem sinal");render()}},10000);
  S.db.collection("fichas").onSnapshot(async snap=>{
    S.items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.dataVerificacao||"").localeCompare(a.dataVerificacao||"")||(b.criadoEm||"").localeCompare(a.criadoEm||""));
    if(!snap.metadata.fromCache){clearTimeout(timer);S.loaded=true;S.stale=false;if(!S.local)setSync(true,"sincronizado")}else if(!S.loaded)S.loaded=true;
    await resolveProfiles();if(S.view!=="nova")render()},
    e=>{clearTimeout(timer);S.loaded=true;S.err="Não foi possível ler a base da equipe ("+e.code+").";setSync(false,"erro");render()});
  S.db.doc("config/cabecalho").onSnapshot(async s=>{if(s.exists)S.cab={...CFG_PADRAO,...s.data()};$("#hdrSub").textContent=S.cab.l1;S.logoCache=null;await showHdrLogo();if(S.view==="resumo")render()},()=>{});
}
async function resolveProfiles(){if(!S.user)return;const ids=new Set(S.items.map(o=>o.criadoPor).filter(Boolean));if(ids.size)S.profiles=await S.user.profiles([...ids])}

/* ===== Rotas ===== */
function route(){const h=(location.hash||"#lista").slice(1);
  if(h.startsWith("fv-")){S.view="detalhe";S.detail=h.slice(3)}
  else if(h==="nova"){if(S.preparado){S.preparado=false}else if(S.view!=="nova"||S.editingId){S.editingId=null;startForm()}S.view="nova"}
  else if(h==="editar"){S.view="nova"}
  else S.view=h==="resumo"?"resumo":"lista";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===(S.view==="detalhe"?"lista":S.view)?"page":"false"));
  render();window.scrollTo(0,0)}
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
function render(){const app=$("#app");if(S.view==="nova")return renderForm(app);if(S.view==="detalhe")return renderDetail(app);if(S.view==="resumo")return renderResumo(app);renderLista(app)}

  const q=S.filtro.trim().toLowerCase(),list=S.items.filter(o=>!q||[o.codEquip,o.rodovia,o.municipio,o.contratada,fmtKm(num(o.kmCampo))].join(" ").toLowerCase().includes(q));
  app.innerHTML=`<div class="stack">${bannerHTML()}

  <div class="cards">${!S.loaded&&S.db?`<p class="muted">Carregando fichas…</p>`:list.length?list.map(cardHTML).join(""):`<div class="empty">${ICON.sign}<h3 style="color:var(--ink)">Nenhuma ficha registrada</h3>

function cardHTML(o){const n=ncs(o).length,f=(o.fotos||[])[0];

  <span class="row" style="gap:6px"><span class="pill ${n?"c-dentro":"c-fora"}">${n?`${n} não conformidade${n>1?"s":""}`:"Sem não conformidades"}</span>${o.displays?`<span class="pill s-pill">Displays: ${esc(o.displays.toLowerCase())}</span>`:""}</span>

/* ===== Fotos: EXIF (GPS e data) ===== */
function exifInfo(buf){const out={};
  try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return out;let o=2;
    while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4);let gps=0,exif=0;for(let i=0,n=u16(ifd0);i<n;i++){const e=ifd0+2+i*12,tg=u16(e);if(tg===0x8825)gps=t+u32(e+8);if(tg===0x8769)exif=t+u32(e+8)}
        if(exif)for(let i=0,n=u16(exif);i<n;i++){const e=exif+2+i*12;if(u16(e)===0x9003){const p=t+u32(e+8);let s="";for(let k=0;k<19;k++)s+=String.fromCharCode(v.getUint8(p+k));const mm=s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);if(mm)out.dt=`${mm[3]}/${mm[2]}/${mm[1]} ${mm[4]}:${mm[5]}`}}
        if(gps){const g={};for(let i=0,n=u16(gps);i<n;i++){const e=gps+2+i*12,tag=u16(e);if(tag===1||tag===3)g[tag]=String.fromCharCode(v.getUint8(e+8));
          if(tag===2||tag===4){const p=t+u32(e+8),r=k=>u32(p+k*8)/u32(p+k*8+4);g[tag]=r(0)+r(1)/60+r(2)/3600}}
          if(g[2]!=null&&g[4]!=null){out.lat=(g[1]==="S"?-1:1)*g[2];out.lon=(g[3]==="W"?-1:1)*g[4]}}
        return out}
      if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch{}return out}
async function addFotos(files,catFixa){
  for(const f of files){if(!f.type.startsWith("image/"))continue;
    try{const ex=exifInfo(await f.arrayBuffer());const big=await comprimir(f,1600,.82),small=await comprimir(f,900,.6);
      const usadas=S.photos.map(p=>p.cat),cat=catFixa||CAT_FOTO.find(c=>!usadas.includes(c))||"Sinalização vertical";
      S.photos.push({key:newId(),blob:big.blob,thumb:small.dataURL,small:small.dataURL,cat,sentido:"Crescente",legenda:"",lat:ex.lat??null,lon:ex.lon??null,dt:ex.dt||""})}
    catch{toast("Não foi possível ler uma das imagens.")}}
  drawPhotos();if(catFixa)toast(`${files.length>1?files.length+" fotos adicionadas":"Foto adicionada"} em ${catFixa.toLowerCase()}.`)}

async function enviarFotos(id,photos){const out=[];
  for(const p of photos){const meta={cat:p.cat||"",sentido:p.sentido||"",legenda:p.legenda||"",lat:p.lat??null,lon:p.lon??null,dt:p.dt||""};
    if(p.existing&&(p.assetId||p.fotoDoc)){out.push({...(p.assetId?{assetId:p.assetId}:{fotoDoc:p.fotoDoc}),...meta});continue}
    if(!p.blob&&p.dataURL){try{p.blob=await (await fetch(p.dataURL)).blob()}catch{}}
    let ref=null;
    if(S.assets&&p.blob){try{const r=await S.assets.upload(p.blob,{type:"image/jpeg"});ref={assetId:r.id}}catch{}}
    if(!ref){let data=S.local&&p.blob?await blobURL(p.blob):(p.small||p.dataURL);
      if(!S.local&&data.length>240000){const img=await loadImg(data),c=document.createElement("canvas"),k=640/Math.max(img.width,img.height);c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",.5)}
      const fid=id+"-"+newId();await comTimeout(S.db.doc("fotos/"+fid).set({data,ficha:id}),20000);ref={fotoDoc:fid}}
    p.existing=true;Object.assign(p,ref);out.push({...ref,...meta})}
  return out}

async function exportarPacote(list){toast("Preparando pacote…",8000);const fichas=[];
  for(const o of list){const fotos=[];for(const f of o.fotos||[]){const d=await dataURLDe(f);if(d)fotos.push({...f,assetId:undefined,fotoDoc:undefined,dataURL:d})}const c={...o,fotos};delete c.criadoPor;fichas.push(c)}
  baixar(`pacote_FVC_${stamp()}_${list.length}.json`,JSON.stringify({app:"vistoria-fvc",versao:1,exportadoEm:new Date().toISOString(),fichas}))}
async function importarPacote(file){let pac;try{pac=JSON.parse(await file.text())}catch{toast("Arquivo inválido.");return}
  if(!pac||pac.app!=="vistoria-fvc"||!Array.isArray(pac.fichas)){toast("Este arquivo não é um pacote do app FVC.");return}
  toast(`Importando ${pac.fichas.length} ficha(s)…`,15000);let ok=0,ign=0,falha=0;
  for(const o of pac.fichas){try{const ex=S.items.find(x=>x.id===o.id);if(ex&&(ex.atualizadoEm||"")>=(o.atualizadoEm||"")){ign++;continue}
    const fotos=await enviarFotos(o.id,(o.fotos||[]).map(f=>({...f,key:newId(),small:f.dataURL})));const c={...o,fotos};delete c.id;await S.db.doc("fichas/"+o.id).set(c);ok++}catch{falha++}}
  toast(`Pacote importado: ${ok} ficha(s), ${ign} já em dia${falha?`, ${falha} com erro`:""}.`,7000)}

    doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.setTextColor(0);doc.text("FICHA DE VERIFICAÇÃO DE CONFORMIDADE - FVC",W/2,y+4,{align:"center"});y+=10};

  const box=(x,yy,w,txt,al="center")=>{doc.setDrawColor(0);doc.setLineWidth(.2);doc.rect(x,yy-3.4,w,4.6);doc.setFont("helvetica","normal");doc.setFontSize(8);const t=doc.splitTextToSize(T(txt??""),w-2)[0]||"";doc.text(t,al==="center"?x+w/2:x+1,yy,{align:al})};

  const obsBox=(t,h=16)=>{gar(h+3);doc.setLineWidth(.3);doc.rect(M+4,y,CW-8,h);lbl("Observações:",M+5,y+3.5);if(t){doc.setFontSize(8);const ls2=doc.splitTextToSize(T(t),CW-12);doc.text(ls2.slice(0,Math.floor((h-5)/3.6)),M+6,y+7.5)}y+=h+4};
  cab();
  // 1
  barra("1 INSTRUÇÕES GERAIS");
  for(const [k,l] of [["objetivo","Objetivo"],["responsavel","Responsável pela verificação"],["equipamentos","Equipamentos/documentos necessários"],["tramitacao","Tramitação"]]){

/* Croqui esquemático com a posição dos equipamentos */
function croquiEquip(lista,verif){const cv=document.createElement("canvas"),Wc=1000,Hc=1300;cv.width=Wc;cv.height=Hc;const g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,Wc,Hc);const pts=lista.filter(e=>isFinite(e.lat)&&isFinite(e.lon));
  const la=pts.map(e=>e.lat),lo=pts.map(e=>e.lon),k=Math.cos((Math.max(...la)+Math.min(...la))/2*Math.PI/180);
  let x0=Math.min(...lo),x1=Math.max(...lo),y0=Math.min(...la),y1=Math.max(...la);const pad=.35;x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const sx=(Wc-120)/((x1-x0)*k),sy=(Hc-120)/(y1-y0),s=Math.min(sx,sy),ox=(Wc-(x1-x0)*k*s)/2,oy=(Hc-(y1-y0)*s)/2;
  const P=e=>[ox+(e.lon-x0)*k*s,oy+(y1-e.lat)*s];
  g.strokeStyle="#E3E7EE";g.lineWidth=1;g.font="18px Helvetica,Arial";g.fillStyle="#8A93A0";
  for(let a=Math.ceil(y0);a<=y1;a++){const [,yy]=P({lat:a,lon:x0});g.beginPath();g.moveTo(40,yy);g.lineTo(Wc-40,yy);g.stroke();g.fillText(`${a}°`,44,yy-4)}
  for(let a=Math.ceil(x0);a<=x1;a++){const [xx]=P({lat:y0,lon:a});g.beginPath();g.moveTo(xx,40);g.lineTo(xx,Hc-40);g.stroke();g.fillText(`${a}°`,xx+4,Hc-46)}
  const porBR={};pts.forEach(e=>(porBR[e.br]=porBR[e.br]||[]).push(e));const cores=["#1F4E8C","#7A4FB3","#B35F1E","#2B7A4B","#8C1F4E"];
  Object.keys(porBR).sort().forEach((br,i)=>{const L=porBR[br].slice().sort((a,b)=>parseFloat(a.km)-parseFloat(b.km));g.strokeStyle=cores[i%cores.length];g.lineWidth=5;g.globalAlpha=.35;g.beginPath();L.forEach((e,j)=>{const [x,y]=P(e);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.globalAlpha=1;
    const [lx,ly]=P(L[Math.floor(L.length/2)]);g.font="bold 22px Helvetica,Arial";g.fillStyle=cores[i%cores.length];g.textAlign="right";g.fillText(br,lx-24,ly+8);g.textAlign="left"});
  const usados=[];pts.forEach((e,i)=>{let [x,y]=P(e);const st=verif[e.cod];g.beginPath();g.arc(x,y,13,0,7);g.fillStyle=e.cancel||!e.inicio?"#9AA3AE":st==="nc"?"#B3261E":st==="ok"?"#2B7A4B":"#E0A100";g.fill();g.lineWidth=2;g.strokeStyle="#fff";g.stroke();
    let ty=y+6,tx=x+17;while(usados.some(u=>Math.abs(u[0]-tx)<34&&Math.abs(u[1]-ty)<20))ty+=20;usados.push([tx,ty]);
    g.font="bold 18px Helvetica,Arial";g.fillStyle="#111";g.fillText(String(e._n),tx,ty)});
  // legenda
  g.font="18px Helvetica,Arial";[["#2B7A4B","Verificado sem não conformidade"],["#B3261E","Verificado com não conformidade"],["#E0A100","Em operação, sem FVC no mês"],["#9AA3AE","Cancelado / sem início"]].forEach(([c,t],i)=>{const yy=Hc-150+i*28;g.fillStyle=c;g.beginPath();g.arc(Wc-330,yy,9,0,7);g.fill();g.fillStyle="#222";g.fillText(t,Wc-312,yy+6)});
  g.fillStyle="#222";g.font="bold 22px Helvetica,Arial";g.fillText("N",Wc-70,80);g.beginPath();g.moveTo(Wc-62,90);g.lineTo(Wc-72,120);g.lineTo(Wc-52,120);g.closePath();g.fill();
  return cv.toDataURL("image/jpeg",.9)}
